[package]
name = "heatmap-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Persistence, date logic and statistics for the Heatmap desktop app"

[lib]
doctest = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
