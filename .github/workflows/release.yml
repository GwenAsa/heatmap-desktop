name: Release
# Push a tag such as v0.2.0 and this builds the .deb and .AppImage and attaches them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file git patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libfuse2t64

      - run: npm ci
      - name: Test before packaging
        run: |
          cargo test -p heatmap-core
          npx tsc --noEmit
          npm test

      - name: Build .deb and .AppImage
        run: npm run tauri build -- --bundles deb,appimage
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Collect artifacts and checksums
        run: |
          mkdir release
          cp target/release/bundle/deb/*.deb release/
          cp target/release/bundle/appimage/*.AppImage release/
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Keep artifacts for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*
